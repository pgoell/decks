[project]
name = "decks"
version = "0.1.0"
description = "Slide deck editor for people and agents"
readme = "README.md"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"
